name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}            # hatch-vcs needs the tags
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      # no tensorpotential / TensorFlow: the unit tests don't need them
      - run: pip install --no-deps -e . && pip install ase numpy "pandas>=2,<3" pyyaml "pydantic>=2" jinja2 typer rich matplotlib packaging pytest ruff mypy
      - run: ruff check src tests
      - run: mypy
      - run: pytest tests/unit
  docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
