# micromamba create -f environment.yml && micromamba activate grace
name: grace
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pandas<3          # pandas 3 breaks gracemaker's batching (np.array_split on a DataFrame)
  - pip:
      - tensorpotential>=0.6.2,<0.7
      - -e .[dev]
